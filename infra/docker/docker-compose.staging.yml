name: gavel-staging

# Isolated pre-production stack with its own volumes and network. Do not merge
# it with docker-compose.prod.yml: both would name the same containers.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gavel_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: immopulse
      POSTGRES_USER: immopulse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5435:5432"
    networks:
      - staging_net
    command: postgres -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immopulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gavel_staging_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_staging_data:/data
    ports:
      - "6381:6379"
    networks:
      - staging_net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gavel_staging_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_staging_data:/data
    ports:
      - "9010:9000"
    networks:
      - staging_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    image: gavel_web:staging
    container_name: gavel_staging_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://immopulse:${DB_PASSWORD}@postgres:5432/immopulse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9010}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CRON_SECRET: ${CRON_SECRET}
      CRON_EMAIL_SECRET: ${CRON_EMAIL_SECRET:-}
      CRON_OPS_SECRET: ${CRON_OPS_SECRET:-}
      CRON_JOBS_SECRET: ${CRON_JOBS_SECRET:-}
      METRICS_SECRET: ${METRICS_SECRET:-}
      ANALYSE_DAILY_LIMIT: ${ANALYSE_DAILY_LIMIT:-25}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      NODE_ENV: production
      SCRAPER_API_URL: ${SCRAPER_API_URL:-http://scraper:8000}
      SCRAPER_API_SECRET: ${SCRAPER_API_SECRET}
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
      MAPTILER_SERVER_KEY: ${MAPTILER_SERVER_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
    ports:
      - "3001:3000"
    networks:
      - staging_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  scraper:
    build:
      context: ../../
      dockerfile: scrapers/Dockerfile
    image: gavel_scraper:staging
    container_name: gavel_staging_scraper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://immopulse:${DB_PASSWORD}@postgres:5432/immopulse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9010}
      LANGDOCK_API_KEY: ${LANGDOCK_API_KEY:-}
      LANGDOCK_BASE_URL: ${LANGDOCK_BASE_URL:-}
      LANGDOCK_MODEL: ${LANGDOCK_MODEL:-}
      LANGDOCK_EXTRACT_MODEL: ${LANGDOCK_EXTRACT_MODEL:-claude-haiku-4-5-default}
      SCRAPER_API_SECRET: ${SCRAPER_API_SECRET}
      INTERNAL_API_URL: http://web:3000
      CRON_SECRET: ${CRON_SECRET}
      CRON_EMAIL_SECRET: ${CRON_EMAIL_SECRET:-}
      CRON_OPS_SECRET: ${CRON_OPS_SECRET:-}
      CRON_JOBS_SECRET: ${CRON_JOBS_SECRET:-}
      SCRAPE_MIN_INTERVAL_PER_DOMAIN_SEC: ${SCRAPE_MIN_INTERVAL_PER_DOMAIN_SEC:-8}
      SCRAPE_MAX_PER_DOMAIN_HOUR: ${SCRAPE_MAX_PER_DOMAIN_HOUR:-30}
      SCRAPE_MAX_GLOBAL_HOUR: ${SCRAPE_MAX_GLOBAL_HOUR:-60}
      SCRAPE_COOLDOWN_SECONDS: ${SCRAPE_COOLDOWN_SECONDS:-3600}
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - staging_net
    command: >
      uvicorn src.api.app:app --host 0.0.0.0 --port 8000

networks:
  staging_net:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
  minio_staging_data:
