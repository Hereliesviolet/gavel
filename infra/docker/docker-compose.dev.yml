name: gavel

# Local development stack with hot reload. Host ports: web 3000, postgres 5434,
# redis 6380, minio 9000/9001. The `scraper` and `prefect` profiles are opt-in.

services:
  # ─── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gavel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: immopulse
      POSTGRES_USER: immopulse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immopulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gavel_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: gavel_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Next.js app (hot reload) ─────────────────────────────────────────
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile.dev
    container_name: gavel_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://immopulse:${DB_PASSWORD}@postgres:5432/immopulse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: http://localhost:9000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_EMAIL_SECRET: ${CRON_EMAIL_SECRET:-}
      CRON_OPS_SECRET: ${CRON_OPS_SECRET:-}
      CRON_JOBS_SECRET: ${CRON_JOBS_SECRET:-}
      METRICS_SECRET: ${METRICS_SECRET:-}
      ANALYSE_DAILY_LIMIT: ${ANALYSE_DAILY_LIMIT:-25}
      SCRAPER_API_URL: ${SCRAPER_API_URL:-http://scraper:8000}
      SCRAPER_API_SECRET: ${SCRAPER_API_SECRET:-}
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
      MAPTILER_SERVER_KEY: ${MAPTILER_SERVER_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next

  # ─── Python scraper ───────────────────────────────────────────────────────────
  scraper:
    build:
      context: ../../
      dockerfile: scrapers/Dockerfile
    container_name: gavel_scraper
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://immopulse:${DB_PASSWORD}@postgres:5432/immopulse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MISSING_TOLERANCE_DAYS: ${MISSING_TOLERANCE_DAYS:-3}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SCRAPER_API_SECRET: ${SCRAPER_API_SECRET:-}
      LANGDOCK_API_KEY: ${LANGDOCK_API_KEY}
      LANGDOCK_BASE_URL: ${LANGDOCK_BASE_URL:-https://api.langdock.com/anthropic/eu/}
      LANGDOCK_MODEL: ${LANGDOCK_MODEL:-claude-sonnet-4-6-default}
      LANGDOCK_EXTRACT_MODEL: ${LANGDOCK_EXTRACT_MODEL:-claude-haiku-4-5-default}
    profiles: ["scraper"]

  # ─── Prefect server (optional) ───────────────────────────────────
  prefect:
    image: prefecthq/prefect:3-latest
    container_name: gavel_prefect
    restart: unless-stopped
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://immopulse:${DB_PASSWORD}@postgres:5432/immopulse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    profiles: ["prefect"]

  # ─── Prefect worker (long-running flow runner) ─────────────────────────────────
  prefect-worker:
    build:
      context: ../../
      dockerfile: scrapers/Dockerfile
    container_name: gavel_prefect_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://immopulse:${DB_PASSWORD}@postgres:5432/immopulse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MISSING_TOLERANCE_DAYS: ${MISSING_TOLERANCE_DAYS:-3}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: http://localhost:9000
      LANGDOCK_API_KEY: ${LANGDOCK_API_KEY}
      LANGDOCK_BASE_URL: ${LANGDOCK_BASE_URL:-https://api.langdock.com/anthropic/eu/}
      LANGDOCK_MODEL: ${LANGDOCK_MODEL:-claude-sonnet-4-6-default}
      LANGDOCK_EXTRACT_MODEL: ${LANGDOCK_EXTRACT_MODEL:-claude-haiku-4-5-default}
      PREFECT_API_URL: http://prefect:4200/api
    command: python deploy_flows.py
    # scrapers/Dockerfile copies scrapers/ to /app.
    working_dir: /app
    profiles: ["prefect"]

volumes:
  # Names are configurable so an existing volume can be reused.
  postgres_data:
    name: ${POSTGRES_VOLUME:-gavel_dev_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME:-gavel_dev_redis_data}
  minio_data:
    name: ${MINIO_VOLUME:-gavel_dev_minio_data}
