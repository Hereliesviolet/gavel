name: gavel

# Optional Prometheus / Alertmanager / Grafana stack. Not part of the default
# start path. Add it to the production files:
#
#   docker compose --env-file ../../.env -f docker-compose.prod.yml \
#     -f docker-compose.monitoring.yml up -d prometheus alertmanager grafana
#
# Prometheus scrapes scraper:8000/internal/metrics and web:3000/api/metrics
# (see infra/monitoring/prometheus.yml). Alertmanager forwards firing alerts to
# /api/cron/ops-alert, which sends them by e-mail to ADMIN_EMAIL.
#
# Grafana is reachable only on the internal Docker network. For browser access
# add a Caddy site block or publish a port yourself.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: gavel_prometheus
    restart: always
    environment:
      SCRAPER_API_SECRET: ${SCRAPER_API_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      METRICS_SECRET: ${METRICS_SECRET}
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gavel_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo -n "$$SCRAPER_API_SECRET" > /tmp/scraper_token && echo -n "$$METRICS_SECRET" > /tmp/cron_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: gavel_alertmanager
    restart: always
    environment:
      CRON_SECRET: ${CRON_SECRET}
      CRON_OPS_SECRET: ${CRON_OPS_SECRET:-}
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - gavel_net
    command:
      - /bin/sh
      - -c
      - echo -n "$${CRON_OPS_SECRET:-$$CRON_SECRET}" > /tmp/webhook_token && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: gavel_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - gavel_net
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
