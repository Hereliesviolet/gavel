# Fail2ban filter for the Caddy JSON access log.
#
# Install: cp infra/fail2ban/filter.d/caddy-auth.conf /etc/fail2ban/filter.d/
#
# Matches repeated 401/403/404 responses per client IP (brute force, scanners,
# path enumeration) in the JSON log written by Caddy's `log` directive.

[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":(401|403|404).*$
ignoreregex =
