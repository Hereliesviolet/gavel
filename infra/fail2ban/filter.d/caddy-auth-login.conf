# Fail2ban filter for failed logins against the Auth.js credentials provider.
#
# Install: cp infra/fail2ban/filter.d/caddy-auth-login.conf /etc/fail2ban/filter.d/
#
# A failed login (POST /api/auth/callback/credentials) is answered with HTTP 302
# back to /login?error=CredentialsSignin, not with 401/403. Caddy's JSON access
# log records the URI and status but not the Location header, so a failed login
# cannot be told apart from a successful one, which is also a 302. The filter
# therefore counts every such POST. That is imprecise but acceptable: real users
# do not log in eight times in five minutes. The thresholds of the
# [caddy-login] jail are set accordingly (see caddy-jail.conf).

[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"method":"POST".*"uri":"/api/auth/callback/credentials(\?[^"]*)?".*"status":302.*$
ignoreregex =
