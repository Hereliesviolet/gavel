# Fail2ban jails for the Gavel Caddy access log.
#
# Install:
#   cp infra/fail2ban/caddy-jail.conf /etc/fail2ban/jail.d/gavel-caddy.conf
#   cp infra/fail2ban/filter.d/*.conf  /etc/fail2ban/filter.d/
#   fail2ban-client reload
#
# `logpath` below points at the log of the bundled Caddy service, which the
# compose project stores in the Docker volume `gavel_caddy_logs` (see
# infra/caddy/Caddyfile, `log { output file /var/log/caddy/access.log }`).
# With a shared reverse proxy, point `logpath` at the file that proxy writes for
# the Gavel site block instead; the log format must be Caddy JSON.
#
# The jails do not set an `action`, so they inherit banaction from the host's
# jail.local (for example ufw).

[caddy-auth]
enabled  = true
port     = http,https
filter   = caddy-auth
logpath  = /var/lib/docker/volumes/gavel_caddy_logs/_data/access.log
maxretry = 5
findtime = 600
bantime  = 3600

# Login brute-force protection. A failed Auth.js credentials login answers with
# 302, not 401/403/404, so it needs its own filter (see
# filter.d/caddy-auth-login.conf). The threshold is higher than for the jail
# above so that users who mistype their password two or three times are not
# banned, while a bot with many fast attempts is.
[caddy-login]
enabled  = true
port     = http,https
filter   = caddy-auth-login
logpath  = /var/lib/docker/volumes/gavel_caddy_logs/_data/access.log
maxretry = 8
findtime = 300
bantime  = 3600
