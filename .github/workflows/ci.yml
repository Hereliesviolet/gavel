name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Without a version input the action takes pnpm from the packageManager
      # field of the root package.json. A different pnpm version resolves the
      # workspace differently than the development machines do.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately not blocking: an advisory appears without any change in this
      # repository and would turn every unrelated pull request red until nobody
      # reads CI any more. The binding channel for advisories is Dependabot
      # (.github/dependabot.yml); this step only makes them visible in the run.
      - name: pnpm audit
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm audit | tee "$RUNNER_TEMP/audit.txt"

      - name: Write audit findings to the run summary
        if: steps.audit.outcome == 'failure'
        run: |
          {
            echo '### pnpm audit reports findings'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Lint (eslint)
        run: pnpm lint

      # No prior next build needed: tsconfig includes .next/types and
      # .next/dev/types only if they exist, and no source file depends on
      # generated Next types.
      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

  scrapers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      # The second call installs the local package in editable mode and checks
      # that the bounds in pyproject.toml match the frozen versions; if one
      # contradicts them, pip aborts here.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -c requirements.txt -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      # Run as a module so scrapers/ is on sys.path: the tests import src.* and
      # the editable install does not expose the package (setuptools finds no
      # package named src in a src layout).
      - name: pytest
        run: python -m pytest tests -q
