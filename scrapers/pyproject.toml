[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gavel-scrapers"
version = "0.1.0"
description = "Gavel Scraper Pipeline"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "minio>=7.2",
    "anthropic>=0.28",
    "instructor>=1.3",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "loguru>=0.7",
    "resend>=2.0",
    "redis>=5.0",
    "pdfplumber>=0.11",
    "scrapling>=0.4.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff>=0.16,<0.17"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set instead of the ruff default, which changes between versions.
select = ["E4", "E7", "E9", "F"]
# E741: single-letter names such as `l` appear in short comprehensions throughout.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Imports after a deliberate code block (environment setup, sys.path changes).
"src/api/app.py" = ["E402"]
"src/utils/scrape_ladder.py" = ["E402"]
"backfill_wohnflaeche.py" = ["E402"]
